<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador de ensamblaje 3D · Laptop</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        color-scheme: dark;
        --accent: #ff4057;
        --accent-soft: rgba(255, 64, 87, 0.15);
        --glass: rgba(14, 17, 27, 0.88);
        --line: rgba(255, 255, 255, 0.12);
        --text: #edf0f6;
        --muted: #9daac0;
      }
      body {
        background: #05070d;
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #c {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: absolute;
        z-index: 10;
        top: 12px;
        left: 12px;
        width: 310px;
        max-height: calc(100% - 24px);
        overflow: auto;
        background: var(--glass);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      }
      #gallery-panel {
        position: fixed;
        z-index: 20;
        top: 12px;
        left: 12px;
        width: min(310px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 16px;
        background: var(--glass);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      }
      .panel-header,
      .info-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .panel-header {
        margin-bottom: 14px;
      }
      h1 {
        font:
          600 12px "Segoe UI",
          sans-serif;
        color: #e6e8ed;
        letter-spacing: 0.09em;
        line-height: 1.4;
      }
      #panel-toggle,
      #info-toggle {
        flex: none;
        width: 28px;
        height: 26px;
        padding: 0;
        color: #bfc3cd;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .toolbar-navigation {
        width: 100%;
        gap: 4px;
      }
      .toolbar-navigation button {
        flex: 1;
        padding: 6px 8px;
      }
      .toolbar-options {
        width: 100%;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toolbar-options button {
        flex: 1;
      }
      #gallery-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      #gallery-list {
        max-height: min(48vh, 440px);
        overflow: auto;
      }
      #gallery-list .paso {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gallery-icon {
        width: 22px;
        color: var(--accent);
        text-align: center;
      }
      #info-heading {
        transition: color 140ms;
      }
      button {
        background: #24252b;
        border: 1px solid var(--line);
        color: #d9dbe1;
        font-weight: 500;
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 11.5px;
        transition:
          background-color 140ms,
          border-color 140ms,
          color 140ms;
      }
      button:hover {
        background: #303139;
        border-color: rgba(255, 255, 255, 0.22);
      }
      button:focus-visible {
        outline: 2px solid rgba(255, 113, 130, 0.8);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.42;
        cursor: default;
      }
      button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .paso {
        padding: 7px 8px;
        margin: 2px 0;
        border: 1px solid transparent;
        border-radius: 7px;
        font-size: 12px;
        line-height: 1.35;
        cursor: pointer;
        color: #b8bfce;
      }
      .paso:hover {
        background: rgba(255, 255, 255, 0.045);
        border-color: var(--line);
      }
      .paso.ok {
        color: #9de7bc;
      }
      .paso.act {
        background: var(--accent-soft);
        border-color: rgba(255, 64, 87, 0.3);
        color: #fff;
      }
      #info {
        position: fixed;
        z-index: 25;
        right: 14px;
        bottom: 14px;
        width: min(370px, calc(100% - 28px));
        max-height: calc(100vh - 28px);
        overflow: auto;
        background: var(--glass);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        font-size: 12.5px;
        line-height: 1.5;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.36);
      }
      .info-panel-header {
        margin: -2px 0 10px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      #info-content {
        color: #d8dce5;
      }
      #info-content b {
        color: var(--accent);
        font-size: 14px;
      }
      #info.collapsed {
        padding-bottom: 10px;
      }
      #info.collapsed .info-panel-header {
        margin-bottom: 0;
      }
      #info.collapsed #info-content {
        display: none;
      }
      #dock {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 390px;
        max-width: calc(100% - 340px);
        padding: 7px 8px;
        background: rgba(14, 17, 27, 0.94);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
      }
      #dock button {
        min-height: 36px;
      }
      #dock-state {
        display: grid;
        min-width: 0;
        flex: 1;
        text-align: center;
        gap: 2px;
      }
      #dock-state strong {
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      #dock-progress-label {
        overflow: hidden;
        color: var(--muted);
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #dock-progress-track {
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
      }
      #dock-progress-fill {
        display: block;
        width: 0;
        height: 100%;
        background: var(--accent);
        transition: width 0.25s;
      }
      #panel.min {
        overflow: hidden;
      }
      #panel.min .panel-header {
        margin-bottom: 0;
      }
      #panel.min #bar,
      #panel.min #lista {
        display: none;
      }
      @media (max-width: 760px) {
        #panel {
          width: min(245px, calc(100vw - 24px));
          max-height: min(46vh, calc(100vh - 24px));
          padding: 12px;
        }
        #gallery-panel {
          width: min(245px, calc(100vw - 24px));
          max-height: min(54vh, calc(100vh - 24px));
          padding: 12px;
        }
        #info {
          right: 8px;
          bottom: 60px;
          width: min(370px, calc(100% - 16px));
          padding: 11px;
        }
        #dock {
          left: 12px;
          right: 12px;
          bottom: 8px;
          transform: none;
          min-width: 0;
          max-width: none;
          gap: 5px;
          padding: 6px;
        }
        #dock button {
          padding: 6px 8px;
        }
        #dock-progress-label {
          max-width: 38vw;
        }
      }
      @media (max-width: 420px) {
        .toolbar-navigation {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        #dock button {
          font-size: 10px;
        }
        #dock-state strong {
          font-size: 9px;
        }
        #dock-progress-label {
          font-size: 8px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel" role="region" aria-label="Controles y pasos del ensamblaje">
      <div class="panel-header">
        <h1>SIMULADOR DE ENSAMBLAJE<br />LAPTOP · 3D</h1>
        <button
          id="panel-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Ocultar panel del simulador"
          title="Ocultar panel"
        >
          ⌃
        </button>
      </div>
      <div id="bar">
        <div class="toolbar-group toolbar-navigation">
          <button id="prev" type="button">Anterior</button
          ><button id="sig" class="on" type="button">Siguiente</button
          ><button id="auto" type="button">Auto</button
          ><button id="rst" type="button">Reiniciar</button>
        </div>
        <div class="toolbar-options">
          <button
            id="voice-toggle"
            class="on"
            type="button"
            aria-pressed="true"
          >
            Voz de Sky: SÍ
          </button><button id="gbtn" type="button">Galería de piezas</button>
        </div>
      </div>
      <div id="lista"></div>
    </div>
    <aside id="gallery-panel" aria-label="Galería de piezas" hidden>
      <div class="panel-header">
        <h1>GALERÍA DE PIEZAS</h1>
        <button id="gallery-close" type="button" aria-label="Volver al ensamblaje">
          ← Volver
        </button>
      </div>
      <div id="gallery-bar">
        <button id="gallery-rotate" type="button" aria-pressed="true">
          Girar ⏯
        </button>
        <button id="gallery-explode" type="button" aria-pressed="false">
          Explotar
        </button>
      </div>
      <div id="gallery-list" role="group" aria-label="Piezas de la laptop"></div>
    </aside>
    <aside id="info" role="region" aria-label="Información del ensamblaje">
      <div class="info-panel-header">
        <span id="info-heading">Información</span
        ><button
          id="info-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Contraer información"
          title="Contraer panel"
        >
          ⌄
        </button>
      </div>
      <div id="info-content">
        <b>Listo para empezar</b><br />Pulsa «Siguiente» para iniciar el ensamblaje.
      </div>
    </aside>
    <nav id="dock" aria-label="Navegación rápida del ensamblaje">
      <button
        id="dock-prev"
        type="button"
        aria-label="Paso anterior"
        title="Paso anterior"
      >
        ←
      </button>
      <div id="dock-state" aria-live="polite">
        <strong>LISTO</strong
        ><span id="dock-progress-label"
          >0 de 9 componentes · Siguiente: Chasis inferior</span
        ><span id="dock-progress-track" aria-hidden="true"
          ><i id="dock-progress-fill"></i
        ></span>
      </div>
      <button id="dock-next" class="on" type="button">
        Siguiente <span aria-hidden="true">→</span></button
      ><button
        id="dock-auto"
        type="button"
        aria-label="Ensamblaje automático"
        title="Ensamblaje automático"
      >
        ▶
      </button>
    </nav>

    <!-- Usa las mismas librerías de tu proyecto: pon este archivo junto a tu index.html -->
    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/CopyShader.js"></script>
    <script src="js/LuminosityHighPassShader.js"></script>
    <script src="js/EffectComposer.js"></script>
    <script src="js/MaskPass.js"></script>
    <script src="js/ShaderPass.js"></script>
    <script src="js/RenderPass.js"></script>
    <script src="js/UnrealBloomPass.js"></script>
    <script src="../../images/facultad-data.js"></script>
    <script src="../../js/sky.js"></script>
    <script>
      // ================= 1. PASOS DEL ENSAMBLAJE =================
      // id = nombre de la pieza | c = cámara [x,y,z, mira-x,mira-y,mira-z]
      const VISTA = [0, 13, 13, 0, 0, -1];
      const PASOS = [
        {
          n: "Chasis inferior",
          id: "base",
          t: "Es la base de la laptop. Aquí se alojan todos los componentes internos.",
          c: [0, 15, 15, 0, 0, 0],
        },
        {
          n: "Placa base",
          id: "mobo",
          t: "Conecta todos los componentes y fija la placa al chasis con sus tornillos.",
          c: [0, 19, 10, 0, 0.2, -1.9],
        },
        {
          n: "Procesador",
          id: "cpu",
          t: "Alinea el procesador con su zócalo y asegúrate de que quede bien fijado.",
          c: [-2, 7, 5, -1.5, 0.4, -2.6],
        },
        {
          n: "Memoria RAM",
          id: "ram",
          t: "Inserta los módulos inclinados y presiónalos hasta que hagan clic.",
          c: [4, 7, 6, 4.5, 0.4, 0],
        },
        {
          n: "SSD M.2",
          id: "ssd",
          t: "Inserta la unidad en su ranura M.2 y asegúrala con el tornillo.",
          c: [-4, 7, 6, -4.5, 0.4, 0.2],
        },
        {
          n: "Enfriamiento",
          id: "cool",
          t: "Instala el sistema térmico sobre la placa para disipar el calor de los componentes.",
          c: [-1, 9, 7, -1.5, 0.5, -2.6],
        },
        {
          n: "Batería",
          id: "bat",
          t: "Coloca la batería en la parte delantera del chasis y conecta su cable.",
          c: [0, 10, 13, 0, 0.3, 3],
        },
        {
          id: "deck",
          n: "Teclado y carcasa superior",
          t: "Coloca la carcasa superior para cerrar la base y dejar accesibles el teclado y el touchpad.",
          c: [0, 11, 16, 0, 1, 0],
        },
        {
          n: "Pantalla",
          id: "lid",
          t: "Une la pantalla a la base por las bisagras y conecta el cable plano.",
          c: [0, 8, 22, 0, 3, -3],
        },
        {
          n: "Encender",
          id: null,
          t: "<b>¡Ensamblaje completo!</b> El equipo está encendido y listo para revisión.",
          c: [0, 6, 23, 0, 3, -1],
        },
      ];
      window.COMPONENTES = window.COMPONENTES || {};
      window.COMPONENTES.PASOS = PASOS.map((p) => ({
        n: p.n,
        id: p.id,
        p: p.id && p.id !== "base" ? [p.id] : [],
        t: p.t,
      }));

      // ================= 2. ESCENA =================
      const cv = document.getElementById("c"),
        R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
      R.setPixelRatio(Math.min(devicePixelRatio, 2));
      const S = new THREE.Scene();
      S.background = new THREE.Color(0x04060b);
      const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
      cam.position.set(...VISTA.slice(0, 3));
      const ctl = new THREE.OrbitControls(cam, cv);
      ctl.enableDamping = true;
      ctl.target.set(0, 0, -1);
      S.add(new THREE.HemisphereLight(0xaabbee, 0x101018, 1.1));
      const dl = new THREE.DirectionalLight(0xffffff, 1.1);
      dl.position.set(6, 14, 12);
      S.add(dl);
      S.add(new THREE.GridHelper(40, 40, 0x00e5ff, 0x112233)).position.y =
        -0.01;
      {
        const pm = new THREE.PMREMGenerator(R),
          es = new THREE.Scene();
        es.background = new THREE.Color(0x0b0e16); // reflejos de paneles de luz
        [
          [0x44ccff, -8, 6, 5],
          [0xff44cc, 9, 5, -4],
          [0xffffff, 0, 10, 2],
        ].forEach(([c, x, y, z]) => {
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(7, 0.4, 7),
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(c).multiplyScalar(4),
            }),
          );
          b.position.set(x, y, z);
          es.add(b);
        });
        S.environment = pm.fromScene(es, 0.04).texture;
      }
      const comp = new THREE.EffectComposer(R);
      comp.addPass(new THREE.RenderPass(S, cam));
      comp.addPass(
        new THREE.UnrealBloomPass(
          new THREE.Vector2(innerWidth, innerHeight),
          0.6,
          0.6,
          0.9,
        ),
      );
      function ajustar() {
        R.setSize(innerWidth, innerHeight, false);
        comp.setSize(innerWidth, innerHeight);
        cam.aspect = innerWidth / innerHeight;
        cam.fov = innerWidth < 600 ? 82 : 42;
        cam.updateProjectionMatrix();
      }
      addEventListener("resize", ajustar);
      ajustar();

      // ================= 3. UTILIDADES =================
      const M = (c, o = {}) =>
        new THREE.MeshStandardMaterial(
          Object.assign({ color: c, roughness: 0.5, metalness: 0.4 }, o),
        );
      const box = (w, h, d, m, x, y, z) => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
        b.position.set(x, y, z);
        return b;
      };
      const dark = M(0x1b2030),
        pcbM = M(0x155f42, {
          metalness: 0.2,
          emissive: 0x07180e,
          emissiveIntensity: 0.12,
        }),
        chip = M(0x0a0a0f),
        cobre = M(0xc4733a, { metalness: 0.9, roughness: 0.3 });
      const neon = M(0x00e5ff, { emissive: 0x00e5ff, emissiveIntensity: 0.9 });
      const L = new THREE.Group();
      S.add(L); // grupo de toda la laptop
      const P = {}; // piezas por id
      function pieza(id, hijos, pos) {
        const g = new THREE.Group();
        hijos.forEach((h) => g.add(h));
        g.userData = { to: pos || new THREE.Vector3(), t: 1 };
        g.position.copy(g.userData.to);
        g.visible = false;
        L.add(g);
        P[id] = g;
        return g;
      }

      // ================= 4. PIEZAS (más realistas) =================
      const alu = M(0x2b303b, { metalness: 0.9, roughness: 0.35 }),
        oro = M(0xd4af37, { metalness: 1, roughness: 0.3 }),
        niquel = M(0xd0d4da, { metalness: 1, roughness: 0.2 }),
        plata = M(0xaab0b8, { metalness: 0.9, roughness: 0.3 });
      function lienzo(w, h, f) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        f(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c);
        t.anisotropy = 8;
        return t;
      }
      function rgeo(w, h, d, r) {
        const x = -w / 2,
          y = -d / 2,
          s = new THREE.Shape(); // caja con esquinas redondeadas y bisel
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + d - r);
        s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
        s.lineTo(x + r, y + d);
        s.quadraticCurveTo(x, y + d, x, y + d - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        const g = new THREE.ExtrudeGeometry(s, {
          depth: h,
          amount: h,
          bevelEnabled: true,
          bevelSize: 0.02,
          bevelThickness: 0.02,
          bevelSegments: 2,
        });
        g.rotateX(-Math.PI / 2);
        g.translate(0, -h / 2, 0);
        return g;
      }
      const rb = (w, h, d, r, m, x, y, z) => {
        const b = new THREE.Mesh(rgeo(w, h, d, r), m);
        b.position.set(x, y, z);
        return b;
      };
      const cil = (r, h, m, x, y, z) => {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), m);
        c.position.set(x, y, z);
        return c;
      };
      const plano = (w, d, tex, x, y, z, tr = true) => {
        const p = new THREE.Mesh(
          new THREE.PlaneGeometry(w, d),
          new THREE.MeshBasicMaterial({
            map: tex,
            transparent: tr,
            depthWrite: false,
          }),
        );
        p.rotation.x = -Math.PI / 2;
        p.position.set(x, y, z);
        return p;
      };
      const etiqueta = (txt, col, bg) =>
        lienzo(512, 128, (g, w, h) => {
          g.fillStyle = bg;
          g.fillRect(0, 0, w, h);
          g.fillStyle = col;
          g.font = "bold 44px Segoe UI";
          g.textAlign = "center";
          g.fillText(txt, w / 2, h / 2 + 15);
        });

      // chasis: carcasa de aluminio, tornillos, rejillas de aire y puertos
      const ch = [
        rb(16, 0.2, 11, 0.5, alu, 0, 0.1, 0),
        box(16, 0.7, 0.3, alu, 0, 0.45, -5.35),
        box(16, 0.7, 0.3, alu, 0, 0.45, 5.35),
        box(0.3, 0.7, 11, alu, -7.85, 0.45, 0),
        box(0.3, 0.7, 11, alu, 7.85, 0.45, 0),
      ];
      [
        [-7.3, -4.8],
        [7.3, -4.8],
        [-7.3, 4.8],
        [7.3, 4.8],
        [0, -4.8],
        [0, 4.8],
      ].forEach(([x, z]) => ch.push(cil(0.13, 0.1, plata, x, 0.24, z)));
      for (let i = 0; i < 10; i++)
        [-5.6 + i * 0.25, 1.2 + i * 0.25].forEach((x) =>
          ch.push(box(0.1, 0.03, 2.4, chip, x, 0.21, -2.6)),
        );
      [-3, -1.6, -0.2].forEach((z) => {
        ch.push(box(0.4, 0.22, 0.8, chip, -7.85, 0.45, z));
        ch.push(box(0.4, 0.22, 0.8, chip, 7.85, 0.45, z + 0.3));
      });
      ch.push(box(0.4, 0.22, 1.4, chip, -7.85, 0.45, 2));
      pieza("base", ch);

            g.drawImage(
              imagenFacultad,
              (imagenFacultad.naturalWidth - ancho) / 2,
              (imagenFacultad.naturalHeight - alto) / 2,
              ancho,
              alto,
              0,
              0,
              1024,
              614,
            );

            const fondo = g.createLinearGradient(0, 0, 1024, 614);
            fondo.addColorStop(0, "#101a2c");
            fondo.addColorStop(1, "#42151e");
            g.fillStyle = fondo;

      function mostrarPiezaGaleria(id) {
        if (galleryObject) galleryScene.remove(galleryObject);
        const source = P[id];
        const model = source.clone(true);
        model.position.set(0, 0, 0);
        model.rotation.set(0, 0, 0);
        model.scale.set(1, 1, 1);
        model.traverse((object) => {
          object.visible = true;
        });
        const bounds = new THREE.Box3().setFromObject(model);
        const center = bounds.getCenter(new THREE.Vector3());
        const size = bounds.getSize(new THREE.Vector3());
        model.position.sub(center);
        galleryObject = new THREE.Group();
        galleryObject.add(model);
        galleryObject.scale.setScalar(
          6 / Math.max(size.x, size.y, size.z, 0.01),
        );
        galleryObject.rotation.y = -0.35;
        galleryScene.add(galleryObject);
        galleryChildPositions = model.children.map((child) => ({
          child,
          position: child.position.clone(),
          direction: child.position
            .clone()
            .sub(center)
            .normalize(),
        }));
        galleryChildPositions.forEach((part, index) => {
          if (part.direction.lengthSq() === 0) {
            part.direction.set(index % 2 ? 1 : -1, 0.45, index % 3 ? 0.5 : -0.5);
            part.direction.normalize();
          }
        });
        galleryExploded = false;
        document.getElementById("gallery-explode").setAttribute(
          "aria-pressed",
          "false",
        );
        galleryList.querySelectorAll(".paso").forEach((item) => {
          const selected = item.dataset.id === id;
          item.classList.toggle("act", selected);
          item.setAttribute("aria-pressed", String(selected));
        });
        const detail = FICHA[id];
        const step = PASOS.find((p) => p.id === id);
        info.innerHTML =
          "<b>" +
          step.n +
          '</b><div style="margin:8px 0 2px;color:#ff4057;font-weight:700">¿Para qué sirve?</div>' +
          detail.funcion +
          '<details open style="margin-top:8px;color:#9daac0"><summary style="cursor:pointer">Datos técnicos</summary><ul style="margin:4px 0 0 18px">' +
          detail.datos.map((dato) => "<li>" + dato + "</li>").join("") +
          "</ul></details>" +
          '<div style="margin-top:8px;color:#9daac0;font-size:11px">Arrastra el modelo para girarlo.</div>';
      }

      function alternarExplosion() {
        galleryExploded = !galleryExploded;
        galleryChildPositions.forEach((part) => {
          part.child.position
            .copy(part.position)
            .addScaledVector(part.direction, galleryExploded ? 0.9 : 0);
        });
        document.getElementById("gallery-explode").setAttribute(
          "aria-pressed",
          String(galleryExploded),
        );
      }

      function cambiarGaleria(open) {
        if (galeriaActiva === open) return;
        galeriaActiva = open;
        if (open) {
          infoBeforeGallery = info.innerHTML;
          infoWasCollapsed = document
            .getElementById("info")
            .classList.contains("collapsed");
          document.getElementById("info").classList.remove("collapsed");
          infoHeading.textContent = "Detalle de la pieza";
          document.getElementById("panel").style.display = "none";
          document.getElementById("dock").style.display = "none";
          galleryPanel.hidden = false;
          comp.passes[0].scene = galleryScene;
          comp.passes[0].camera = galleryCamera;
          ctl.enabled = false;
          galleryControls.enabled = true;
          if (timer) {
            clearInterval(timer);
            timer = null;
            auto.classList.remove("on");
          }
          if (window.SKY && window.SKY.suspender) window.SKY.suspender();
          mostrarPiezaGaleria(galleryIds[0]);
        } else {
          galleryPanel.hidden = true;
          document.getElementById("panel").style.display = "";
          document.getElementById("dock").style.display = "";
          document
            .getElementById("info")
            .classList.toggle("collapsed", infoWasCollapsed);
          infoHeading.textContent = "Información";
          info.innerHTML = infoBeforeGallery;
          comp.passes[0].scene = S;
          comp.passes[0].camera = cam;
          ctl.enabled = true;
          galleryControls.enabled = false;
          if (window.SKY && window.SKY.reanudar) window.SKY.reanudar();
        }
      }
      document.getElementById("gbtn").onclick = () => cambiarGaleria(true);
      document.getElementById("gallery-close").onclick = () =>
        cambiarGaleria(false);
      document.getElementById("gallery-rotate").onclick = (event) => {
        galleryControls.autoRotate = !galleryControls.autoRotate;
        event.currentTarget.classList.toggle("on", galleryControls.autoRotate);
        event.currentTarget.setAttribute(
          "aria-pressed",
          String(galleryControls.autoRotate),
        );
      };
      document.getElementById("gallery-explode").onclick =
        alternarExplosion;
      addEventListener("keydown", (event) => {
        if (event.key === "Escape" && galeriaActiva) cambiarGaleria(false);
      });
      addEventListener("resize", () => {
        galleryCamera.aspect = innerWidth / innerHeight;
        galleryCamera.updateProjectionMatrix();
      });

      // ================= 6. ANIMACIÓN =================
      const ease = (k) => 1 - Math.pow(1 - k, 3),
        EX = new THREE.Vector3(0, 9, 0),
        clk = new THREE.Clock();
      (function loop() {
        requestAnimationFrame(loop);
        const dt = Math.min(clk.getDelta(), 0.05),
          tm = clk.elapsedTime;
        Object.values(P).forEach((g) => {
          if (g.userData.t < 1) {
            g.userData.t = Math.min(1, g.userData.t + dt / 0.9);
            g.position
              .copy(g.userData.to)
              .addScaledVector(EX, 1 - ease(g.userData.t));
          }
        });
        if (trans < 1) {
          trans = Math.min(1, trans + dt / 1.2);
          const k = ease(trans);
          cam.position.lerpVectors(c0.p, c1.p, k);
          ctl.target.lerpVectors(c0.t, c1.t, k);
        }
        fans.forEach(
          (f, i) => (f.rotation.y += dt * (encendido ? 14 : 2) * (i ? -1 : 1)),
        );
        teclas.forEach((m) => {
          m.emissive.setHex(0x2a0910);
          m.emissiveIntensity = encendido ? 0.28 : P.deck.visible ? 0.08 : 0;
        });
        if (galeriaActiva) galleryControls.update();
        else ctl.update();
        comp.render();
      })();
      // ================= 7. MODELOS REALES (.glb) =================
      // Si existe el archivo en models/laptop/, reemplaza la pieza hecha con código por el modelo real.
      // [archivo, giro X, giro Y, giro Z en grados]  -> si un modelo sale acostado o al revés, cambia los giros (ej: 90, 0, 0)
      const MODELOS = {
        base: ["chasis.glb", 0, 0, 0],
        mobo: ["placa.glb", 0, 0, 0],
        cpu: ["cpu.glb", 0, 0, 0],
        ram: ["ram.glb", 0, 0, 0],
        ssd: ["ssd.glb", 0, 0, 0],
        cool: ["cooler.glb", 0, 0, 0],
        bat: ["bateria.glb", 0, 0, 0],
        deck: ["teclado.glb", 0, 0, 0],
      };
      function leerGLB(buf) {
        // lector mínimo de .glb (sin Draco): mallas, jerarquía, materiales PBR y texturas
        const jl = new DataView(buf).getUint32(12, true),
          J = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jl))),
          bo = 28 + jl;
        if ((J.extensionsRequired || []).some((e) => /draco|meshopt/i.test(e)))
          throw new Error(
            "modelo comprimido (Draco): descarga la versión sin comprimir",
          );
        const acc = (i) => {
          const a = J.accessors[i],
            bv = J.bufferViews[a.bufferView],
            n = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 }[a.type],
            T = {
              5120: Int8Array,
              5121: Uint8Array,
              5122: Int16Array,
              5123: Uint16Array,
              5125: Uint32Array,
              5126: Float32Array,
            }[a.componentType],
            sz = T.BYTES_PER_ELEMENT,
            st = bv.byteStride || n * sz,
            o = bo + (bv.byteOffset || 0) + (a.byteOffset || 0);
          if (st === n * sz) return new T(buf.slice(o, o + a.count * n * sz));
          const v = new T(buf.slice(o, o + st * a.count)),
            out = new T(a.count * n);
          for (let i = 0; i < a.count; i++)
            for (let k = 0; k < n; k++) out[i * n + k] = v[(i * st) / sz + k];
          return out;
        };
        const tx = {},
          tex = (i) => {
            if (tx[i]) return tx[i];
            const t = J.textures[i],
              im = J.images[t.source];
            if (im.bufferView == null) return null;
            const bv = J.bufferViews[im.bufferView],
              o = bo + (bv.byteOffset || 0),
              img = new Image(),
              T = new THREE.Texture(img);
            img.onload = () => {
              T.needsUpdate = true;
            };
            img.src = URL.createObjectURL(
              new Blob([buf.slice(o, o + bv.byteLength)], {
                type: im.mimeType,
              }),
            );
            T.flipY = false;
            T.wrapS = T.wrapT = THREE.RepeatWrapping;
            T.anisotropy = 4;
            return (tx[i] = T);
          };
        const mats = (J.materials || []).map((m) => {
          const pb = m.pbrMetallicRoughness || {},
            o = {
              color: new THREE.Color().fromArray(
                (pb.baseColorFactor || [1, 1, 1]).slice(0, 3),
              ),
              metalness: pb.metallicFactor == null ? 1 : pb.metallicFactor,
              roughness: pb.roughnessFactor == null ? 1 : pb.roughnessFactor,
              side: m.doubleSided ? THREE.DoubleSide : THREE.FrontSide,
            };
          if (pb.baseColorTexture) o.map = tex(pb.baseColorTexture.index);
          if (pb.metallicRoughnessTexture)
            o.metalnessMap = o.roughnessMap = tex(
              pb.metallicRoughnessTexture.index,
            );
          if (m.normalTexture) o.normalMap = tex(m.normalTexture.index);
          if (m.emissiveFactor && m.emissiveFactor.some((c) => c > 0)) {
            o.emissive = new THREE.Color().fromArray(m.emissiveFactor);
            if (m.emissiveTexture) o.emissiveMap = tex(m.emissiveTexture.index);
          }
          if (m.alphaMode === "MASK")
            o.alphaTest = m.alphaCutoff == null ? 0.5 : m.alphaCutoff;
          else if (m.alphaMode === "BLEND") o.transparent = true;
          Object.keys(o).forEach((k) => o[k] == null && delete o[k]);
          return new THREE.MeshStandardMaterial(o);
        });
        const malla = (mi) => {
          const g = new THREE.Group();
          J.meshes[mi].primitives.forEach((pr) => {
            const G = new THREE.BufferGeometry(),
              a = pr.attributes;
            G.setAttribute(
              "position",
              new THREE.BufferAttribute(acc(a.POSITION), 3),
            );
            if (a.NORMAL)
              G.setAttribute(
                "normal",
                new THREE.BufferAttribute(acc(a.NORMAL), 3),
              );
            if (a.TEXCOORD_0)
              G.setAttribute(
                "uv",
                new THREE.BufferAttribute(acc(a.TEXCOORD_0), 2),
              );
            if (pr.indices != null)
              G.setIndex(
                new THREE.BufferAttribute(new Uint32Array(acc(pr.indices)), 1),
              );
            if (!a.NORMAL) G.computeVertexNormals();
            g.add(
              new THREE.Mesh(
                G,
                pr.material != null ? mats[pr.material] : M(0x888888),
              ),
            );
          });
          return g;
        };
        const nodo = (i) => {
          const n = J.nodes[i],
            g = n.mesh != null ? malla(n.mesh) : new THREE.Group();
          if (n.matrix) {
            g.matrix.fromArray(n.matrix);
            g.matrix.decompose(g.position, g.quaternion, g.scale);
          } else {
            if (n.translation) g.position.fromArray(n.translation);
            if (n.rotation) g.quaternion.fromArray(n.rotation);
            if (n.scale) g.scale.fromArray(n.scale);
          }
          (n.children || []).forEach((c) => g.add(nodo(c)));
          return g;
        };
        const raiz = new THREE.Group();
        J.scenes[J.scene || 0].nodes.forEach((i) => raiz.add(nodo(i)));
        return raiz;
      }
      async function cargarModelo(id, [f, rx, ry, rz]) {
        try {
          const url = "models/laptop/" + f;
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) {
            console.info(
              "Modelo no disponible, se usa la pieza procedural:",
              id,
              f,
            );
            return;
          }
          const buf = await r.arrayBuffer();
          if (buf.byteLength < 20) {
            return;
          }
          const modelo = leerGLB(buf),
            g = P[id],
            V = THREE.Vector3;
          L.updateMatrixWorld(true);
          const bb = new THREE.Box3().setFromObject(g),
            a = bb.getSize(new V()),
            bc = bb.getCenter(new V()); // espacio que ocupaba la pieza simple
          const w = new THREE.Group(),
            D = Math.PI / 180;
          w.add(modelo);
          w.rotation.set(rx * D, ry * D, rz * D);
          w.updateMatrixWorld(true);
          const mb = new THREE.Box3().setFromObject(w),
            m = mb.getSize(new V()),
            mc = mb.getCenter(new V()),
            k = Math.min(a.x / m.x, a.z / m.z); // escala para que quepa
          w.scale.setScalar(k);
          w.position.set(
            bc.x - mc.x * k,
            bb.min.y - mb.min.y * k,
            bc.z - mc.z * k,
          );
          while (g.children.length) g.remove(g.children[0]);
          g.add(w);
          if (id === "cool") fans.length = 0;
          console.log("Modelo real cargado:", id);
        } catch (e) {
          console.info(
            "Se conserva la pieza procedural porque el modelo no está disponible:",
            id,
            f,
          );
        }
      }
      Object.entries(MODELOS).forEach(([id, c]) => cargarModelo(id, c));
      ir(-1);
      P.base.visible = true;
    </script>
