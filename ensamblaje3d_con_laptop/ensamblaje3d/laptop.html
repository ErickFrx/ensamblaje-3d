<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador de ensamblaje 3D · Laptop</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        color-scheme: dark;
        --accent: #ff4057;
        --accent-soft: rgba(255, 64, 87, 0.15);
        --glass: rgba(14, 17, 27, 0.88);
        --line: rgba(255, 255, 255, 0.12);
        --text: #edf0f6;
        --muted: #9daac0;
      }
      body {
        background: #05070d;
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #c {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: absolute;
        z-index: 10;
        top: 12px;
        left: 12px;
        width: 310px;
        max-height: calc(100% - 24px);
        overflow: auto;
        background: var(--glass);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      }
      #gallery-panel {
        position: fixed;
        z-index: 20;
        top: 12px;
        left: 12px;
        width: min(310px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 16px;
        background: var(--glass);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      }
      .panel-header,
      .info-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .panel-header {
        margin-bottom: 14px;
      }
      h1 {
        font:
          600 12px "Segoe UI",
          sans-serif;
        color: #e6e8ed;
        letter-spacing: 0.09em;
        line-height: 1.4;
      }
      #panel-toggle,
      #info-toggle {
        flex: none;
        width: 28px;
        height: 26px;
        padding: 0;
        color: #bfc3cd;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .toolbar-navigation {
        width: 100%;
        gap: 4px;
      }
      .toolbar-navigation button {
        flex: 1;
        padding: 6px 8px;
      }
      .toolbar-options {
        width: 100%;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toolbar-options button {
        flex: 1;
      }
      #gallery-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      #gallery-list {
        max-height: min(48vh, 440px);
        overflow: auto;
      }
      #gallery-list .paso {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gallery-icon {
        width: 22px;
        color: var(--accent);
        text-align: center;
      }
      #info-heading {
        transition: color 140ms;
      }
      button {
        background: #24252b;
        border: 1px solid var(--line);
        color: #d9dbe1;
        font-weight: 500;
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 11.5px;
        transition:
          background-color 140ms,
          border-color 140ms,
          color 140ms;
      }
      button:hover {
        background: #303139;
        border-color: rgba(255, 255, 255, 0.22);
      }
      button:focus-visible {
        outline: 2px solid rgba(255, 113, 130, 0.8);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.42;
        cursor: default;
      }
      button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .paso {
        padding: 7px 8px;
        margin: 2px 0;
        border: 1px solid transparent;
        border-radius: 7px;
        font-size: 12px;
        line-height: 1.35;
        cursor: pointer;
        color: #b8bfce;
      }
      .paso:hover {
        background: rgba(255, 255, 255, 0.045);
        border-color: var(--line);
      }
      .paso.ok {
        color: #9de7bc;
      }
      .paso.act {
        background: var(--accent-soft);
        border-color: rgba(255, 64, 87, 0.3);
        color: #fff;
      }
      #info {
        position: fixed;
        z-index: 25;
        right: 14px;
        bottom: 14px;
        width: min(370px, calc(100% - 28px));
        max-height: calc(100vh - 28px);
        overflow: auto;
        background: var(--glass);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        font-size: 12.5px;
        line-height: 1.5;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.36);
      }
      .info-panel-header {
        margin: -2px 0 10px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      #info-content {
        color: #d8dce5;
      }
      #info-content b {
        color: var(--accent);
        font-size: 14px;
      }
      #info.collapsed {
        padding-bottom: 10px;
      }
      #info.collapsed .info-panel-header {
        margin-bottom: 0;
      }
      #info.collapsed #info-content {
        display: none;
      }
      #dock {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 390px;
        max-width: calc(100% - 340px);
        padding: 7px 8px;
        background: rgba(14, 17, 27, 0.94);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
      }
      #dock button {
        min-height: 36px;
      }
      #dock-state {
        display: grid;
        min-width: 0;
        flex: 1;
        text-align: center;
        gap: 2px;
      }
      #dock-state strong {
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      #dock-progress-label {
        overflow: hidden;
        color: var(--muted);
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #dock-progress-track {
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
      }
      #dock-progress-fill {
        display: block;
        width: 0;
        height: 100%;
        background: var(--accent);
        transition: width 0.25s;
      }
      #panel.min {
        overflow: hidden;
      }
      #panel.min .panel-header {
        margin-bottom: 0;
      }
      #panel.min #bar,
      #panel.min #lista {
        display: none;
      }
      @media (max-width: 760px) {
        #panel {
          width: min(245px, calc(100vw - 24px));
          max-height: min(46vh, calc(100vh - 24px));
          padding: 12px;
        }
        #gallery-panel {
          width: min(245px, calc(100vw - 24px));
          max-height: min(54vh, calc(100vh - 24px));
          padding: 12px;
        }
        #info {
          right: 8px;
          bottom: 60px;
          width: min(370px, calc(100% - 16px));
          padding: 11px;
        }
        #dock {
          left: 12px;
          right: 12px;
          bottom: 8px;
          transform: none;
          min-width: 0;
          max-width: none;
          gap: 5px;
          padding: 6px;
        }
        #dock button {
          padding: 6px 8px;
        }
        #dock-progress-label {
          max-width: 38vw;
        }
      }
      @media (max-width: 420px) {
        .toolbar-navigation {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        #dock button {
          font-size: 10px;
        }
        #dock-state strong {
          font-size: 9px;
        }
        #dock-progress-label {
          font-size: 8px;
        }
      }
    </style>
  <link rel="stylesheet" href="../../css/simulador.css"><link rel="stylesheet" href="../../css/sky.css"><link rel="stylesheet" href="../../css/interfaz.css">
<script>if(window.top===window)location.replace("../../index.html#laptop");window.SIM_ACTIVE=true;</script></head>
  <body class="laptop-mode interfaz-clara">
    <canvas id="c"></canvas>
    <img id="logo-universidad" src="../../images/logo-universidad-ajustado.png" alt="Universidad Nacional de Cañete">
    <div id="panel" role="region" aria-label="Controles y pasos del ensamblaje">
      <div class="panel-header">
        <h1>SIMULADOR DE ENSAMBLAJE<br />LAPTOP EDUCATIVA · 3D</h1>
        <button
          id="panel-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Ocultar panel del simulador"
          title="Ocultar panel"
        >
          ⌃
        </button>
      </div>
      <div id="bar">
        <div class="toolbar-group toolbar-navigation">
          <button id="prev" type="button">Anterior</button
          ><button id="sig" class="on" type="button">Siguiente</button
          ><button id="auto" type="button">Auto</button
          ><button id="rst" type="button">Reiniciar</button>
        </div>
        <div class="toolbar-options">
          <button
            id="voice-toggle"
            class="on"
            type="button"
            aria-pressed="true"
          >
            Voz de Sky: SÍ
          </button><button id="laboratorio-toggle" type="button">Aula 3D: NO</button><button id="gbtn" type="button">Galería de piezas</button>
        </div>
      </div>
      <div id="modelo-laptop-status" role="status">Cargando modelo exterior…</div>
      <div id="lista"></div>
    </div>
    <aside id="gallery-panel" aria-label="Galería de piezas" hidden>
      <div class="panel-header">
        <h1>GALERÍA DE PIEZAS</h1>
        <button id="gallery-close" type="button" aria-label="Volver al ensamblaje">
          ← Volver
        </button>
      </div>
      <div id="gallery-bar">
        <button id="gallery-rotate" type="button" aria-pressed="true">
          Girar ⏯
        </button>
        <button id="gallery-explode" type="button" aria-pressed="false">
          Explotar
        </button>
      </div>
      <div id="gallery-list" role="group" aria-label="Piezas de la laptop"></div>
    </aside>
    <aside id="info" role="region" aria-label="Información del ensamblaje">
      <div class="info-panel-header">
        <span id="info-heading">Información</span
        ><button
          id="info-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Contraer información"
          title="Contraer panel"
        >
          ⌄
        </button>
      </div>
      <div id="info-content">
        <b>Listo para empezar</b><br />Pulsa «Siguiente» para iniciar el ensamblaje.
      </div>
    </aside>
    <nav id="dock" aria-label="Navegación rápida del ensamblaje">
      <button
        id="dock-prev"
        type="button"
        aria-label="Paso anterior"
        title="Paso anterior"
      >
        ←
      </button>
      <div id="dock-state" aria-live="polite">
        <strong>LISTO</strong
        ><span id="dock-progress-label"
          >0 de 9 componentes · Siguiente: Chasis inferior</span
        ><span id="dock-progress-track" aria-hidden="true"
          ><i id="dock-progress-fill"></i
        ></span>
      </div>
      <button id="dock-next" class="on" type="button">
        Siguiente <span aria-hidden="true">→</span></button
      ><button
        id="dock-auto"
        type="button"
        aria-label="Ensamblaje automático"
        title="Ensamblaje automático"
      >
        ▶
      </button>
    </nav>

    <script src="../../js/ShaderPass.js"></script>
    <script src="../../js/RenderPass.js"></script>
    <script src="../../js/UnrealBloomPass.js"></script>
    <script src="../../js/render-base.js"></script>
    <script src="../../images/facultad-data.js"></script>
    <script src="../../js/pantalla-compartida.js"></script>
    <script src="../../js/simulador-bridge.js"></script>
    <script src="../../js/sky.js"></script>
    <script src="../../js/laptop-modelos.js"></script>
    <script src="../../models/laptop/exterior-data.js"></script>
    <script src="../../js/laptop-exterior.js"></script>
    <script src="../../js/laptop.js"></script>
<script src="../../js/laboratorio.js"></script><script src="../../js/interfaz.js"></script>

  </body>
</html>
